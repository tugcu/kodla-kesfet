<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Kız öğrenciler için yapay zeka ve yazılım eğitimi: kısa videolar, quizler, ödevler ve ders sonu değerlendirmesi.">
<title>Kodla & Keşfet</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💜</text></svg>">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="css/lms.css?v=2">
</head>
<body>
<header class="top" id="top"></header>
<script>
  // Betiklerden biri yüklenemez ya da hata verirse sayfa boş kalmasın; kullanıcıya yenilemeyi öner.
  window.addEventListener("error", function (e) {
    if (!e.filename || !/\/js\//.test(e.filename)) return;
    setTimeout(function () {
      var app = document.getElementById("app");
      if (!app || app.children.length) return;
      app.innerHTML = '<div class="panel empty-state"><div class="big">🔄</div><h2>Sayfa tam yüklenemedi</h2>' +
        '<p class="mut">Tarayıcın eski bir sürümü önbellekten yüklemiş olabilir.</p>' +
        '<button onclick="location.reload()">Sayfayı yenile</button>' +
        '<p class="mut small">Sorun sürerse Ctrl+Shift+R (Mac: Cmd+Shift+R) ile yenile.</p></div>';
    }, 300);
  });
</script>
<main id="app"></main>
<footer class="foot">Kodla &amp; Keşfet · Demo sürüm: veriler bu tarayıcıda saklanır.</footer>

<!-- Kod editörü: CDN'e erişilemezse uygulama düz bir metin alanına geri döner. -->
